<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module d'Équilibrage des Équipes</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Permettre le défilement global de la page */
        html, body {
            height: auto;
            min-height: 100vh;
            overflow-y: auto;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        
        .layout-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            align-items: start;
        }
        
        /* Panneau de configuration */
        .panneau-reglages {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            position: sticky;
            top: 20px;
        }
        .reglage-group { margin-bottom: 15px; }
        .reglage-group label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 5px; }
        .reglage-group input[type="range"] { width: 100%; accent-color: #8b5cf6; }
        
        .btn-algo {
            width: 100%;
            padding: 12px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-algo:hover { background: #7c3aed; }

        /* Zones d'équipes & Jauges */
        .grille-equipes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .colonne-equipe {
            background: #1e293b;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            max-height: 85vh; /* Hauteur max contrôlée pour la colonne */
        }
        .titre-equipe {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        
        .dashboard-stats {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }
        .jauge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .jauge-barre { width: 50%; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
        .jauge-fill { height: 100%; background: #3b82f6; transition: width 0.3s ease; }

        /* Zone scrollable pour les cartes d'agents */
        .liste-agents {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 250px;
        }

        /* Personnalisation de la scrollbar des cartes */
        .liste-agents::-webkit-scrollbar { width: 6px; }
        .liste-agents::-webkit-scrollbar-track { background: #0f172a; border-radius: 3px; }
        .liste-agents::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        .carte-agent-simu {
            background: #334155;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .carte-agent-simu.locked { border-left: 4px solid #f59e0b; background: #2a3749; }
        
        .select-equipe-deplacement {
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 0.75rem;
        }
        
        /* Modal des suggestions */
        .modal-suggestions {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>⚖️ Optimisation & Équilibrage des Équipes</h2>
    </div>

    <div class="layout-grid">
        <!-- Panneau des Réglages -->
        <aside class="panneau-reglages">
            <h3 style="margin-top: 0;">⚙️ Pondération des Critères</h3>
            <p style="font-size: 0.8rem; color: #94a3b8;">Ajuste la priorité des critères avant de lancer la suggestion.</p>
            
            <div class="reglage-group">
                <label>Effectif total & Commandement :</label>
                <input type="range" id="poids-cmd" min="1" max="5" value="5">
            </div>
            <div class="reglage-group">
                <label>Spécialités (COD, RAD...) :</label>
                <input type="range" id="poids-spec" min="1" max="5" value="4">
            </div>
            <div class="reglage-group">
                <label>Pyramide des Âges :</label>
                <input type="range" id="poids-age" min="1" max="5" value="3">
            </div>
            <div class="reglage-group">
                <label>Parité Homme / Femme :</label>
                <input type="range" id="poids-genre" min="1" max="5" value="2">
            </div>

            <button class="btn-algo" onclick="suggererReequilibrage()">⚡ Suggérer un Rééquilibrage</button>
        </aside>

        <!-- Grille des 3 Équipes -->
        <main class="grille-equipes">
            <!-- Équipe A -->
            <div class="colonne-equipe">
                <div class="titre-equipe">🔴 Équipe A <span id="count-A">0</span></div>
                <div class="dashboard-stats" id="stats-A"></div>
                <div class="liste-agents" id="container-A"></div>
            </div>

            <!-- Équipe B -->
            <div class="colonne-equipe">
                <div class="titre-equipe">🟢 Équipe B <span id="count-B">0</span></div>
                <div class="dashboard-stats" id="stats-B"></div>
                <div class="liste-agents" id="container-B"></div>
            </div>

            <!-- Équipe C -->
            <div class="colonne-equipe">
                <div class="titre-equipe">🔵 Équipe C <span id="count-C">0</span></div>
                <div class="dashboard-stats" id="stats-C"></div>
                <div class="liste-agents" id="container-C"></div>
            </div>
        </main>
    </div>

    <!-- Modal des Propositions -->
    <div id="modal-transferts" class="modal-suggestions">
        <div class="modal-content">
            <h3>⚡ Recommandations de Transferts</h3>
            <p style="font-size: 0.85rem; color: #cbd5e1;">L'algorithme suggère les ajustements suivants :</p>
            <ul id="liste-propositions" style="font-size: 0.9rem; line-height: 1.6; color: #60a5fa; max-height: 250px; overflow-y: auto; padding-left: 20px;"></ul>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="appliquerPropositions()" style="flex: 1; padding: 10px; background: #22c55e; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer;">Valider les changements</button>
                <button onclick="fermerModal()" style="padding: 10px; background: #64748b; border: none; color: white; border-radius: 6px; cursor: pointer;">Annuler</button>
            </div>
        </div>
    </div>

    <script src="script_equilibrage.js"></script>
</body>
</html>
