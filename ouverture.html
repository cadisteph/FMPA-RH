    gap:14px;
    text-align:center;
    width:100%;
    max-width:560px;
  }

  h1{
    margin:0;
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    font-weight:700;
    font-size:clamp(1.9rem, 5.4vw, 3.1rem);
    letter-spacing:0.04em;
    color:var(--paper);
    text-shadow:0 2px 18px rgba(0,0,0,0.5);
  }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .divider .bar{
    width:64px;
    height:3px;
    background:var(--gold);
    border-radius:2px;
  }

  .divider .diamond{
    width:9px;
    height:9px;
    background:var(--red);
    transform:rotate(45deg);
    border-radius:2px;
    box-shadow:0 0 0 2px var(--navy-950);
  }

  .actions{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
  }

  .plate{
    appearance:none;
    -webkit-appearance:none;
    flex:1 1 220px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:16px 22px;
    background:var(--navy-800);
    border:2px solid var(--gold);
    border-radius:8px;
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.02em;
    text-decoration:none;
    cursor:pointer;
    transition:background-color 150ms ease, border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }

  .plate .icon{
    font-size:1.15rem;
    line-height:1;
  }

  .plate:hover,
  .plate:focus-visible{
    background:var(--navy-700);
    border-color:var(--gold-bright);
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(0,0,0,0.45);
  }

  .plate:active{
    transform:translateY(0);
  }

  .plate:focus-visible{
    outline:3px solid var(--sky);
    outline-offset:3px;
  }

  .plate--fmpa{
    border-color:var(--sky);
  }

  .plate--fmpa:hover,
  .plate--fmpa:focus-visible{
    border-color:#4fc3ff;
  }

  /* ---------- Modal code d'accès ---------- */

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(5,7,12,0.72);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity 160ms ease;
    z-index:50;
  }

  .overlay.is-open{
    opacity:1;
    pointer-events:auto;
  }

  .modal{
    width:100%;
    max-width:360px;
    background:var(--navy-900);
    border:2px solid var(--gold);
    border-radius:10px;
    padding:26px 24px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
    transform:translateY(8px);
    transition:transform 160ms ease;
  }

  .overlay.is-open .modal{
    transform:translateY(0);
  }

  .modal h2{
    margin:0 0 6px;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:1.2rem;
    letter-spacing:0.02em;
  }

  .modal p{
    margin:0 0 18px;
    font-size:0.86rem;
    color:#b8c2d6;
    line-height:1.4;
  }

  .modal input{
    width:100%;
    padding:12px 14px;
    background:var(--navy-950);
    border:2px solid var(--navy-700);
    border-radius:6px;
    color:var(--paper);
    font-size:1.05rem;
    letter-spacing:0.08em;
    text-align:center;
    font-family:'Inter', sans-serif;
  }

  .modal input:focus-visible{
    outline:none;
    border-color:var(--sky);
  }

  .modal input.is-error{
    border-color:var(--red);
    animation:shake 320ms ease;
  }

  .modal .error-msg{
    min-height:18px;
    margin:8px 0 0;
    font-size:0.82rem;
    color:#ff6b6b;
    text-align:center;
  }

  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }

  .modal-actions button{
    flex:1;
    padding:11px 14px;
    border-radius:6px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    border:2px solid transparent;
  }

  .btn-validate{
    background:var(--gold);
    color:var(--ink);
  }

  .btn-validate:hover{background:var(--gold-bright);}

  .btn-cancel{
    background:transparent;
    border-color:var(--navy-700);
    color:var(--paper);
  }

  .btn-cancel:hover{border-color:var(--paper);}

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }

  @media (prefers-reduced-motion: reduce){
    .plate,
    .overlay,
    .modal{transition:none;}
    .modal input.is-error{animation:none;}
  }

  @media (max-width: 520px){
    .actions{flex-direction:column;}
    .plate{flex:1 1 auto;width:100%;}
  }
</style>
</head>
<body>

  <main class="stage">
    <div class="badge" role="img" aria-label="Écusson des Sapeurs-Pompiers du Havre"></div>

    <div class="identity">
      <h1>CIS Caucriauville</h1>
      <div class="divider" aria-hidden="true">
        <span class="bar"></span>
        <span class="diamond"></span>
        <span class="bar"></span>
      </div>

      <nav class="actions" aria-label="Accès rapide">
        <div class="stage">
    <button class="btn-rh" onclick="connexionRH()">🔑 Accès Gestion RH</button>
  </div>
        <a class="plate plate--fmpa" href="https://cadisteph.github.io/FMPA-RH/saisie_fmpa.html" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">📝</span> Saisie FMPA
        </a>
      </nav>
    </div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Accès Gestion RH</h2>
      <p>Cet espace est réservé. Saisissez le code d'accès pour continuer.</p>
      <form id="code-form" novalidate>
        <input type="password" inputmode="numeric" id="code-input" autocomplete="off" aria-label="Code d'accès">
        <p class="error-msg" id="error-msg" aria-live="polite"></p>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="btn-cancel">Annuler</button>
          <button type="submit" class="btn-validate">Valider</button>
        </div>
      </form>
    </div>
  </div>



  
  <script>
    const HASH_DEFAUT = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4"; // Hash de "1234"

    // Fonction de hachage SHA-256 identique à mdp.html
    async function hacherTexte(texte) {
      const encoder = new TextEncoder();
      const data = encoder.encode(texte);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function connexionRH() {
      try {
        if (!('showOpenFilePicker' in window)) {
          alert("Votre navigateur ne supporte pas l'ouverture de fichier directe.");
          return;
        }

        // 1. Sélection du fichier Excel de référence
        const [handle] = await window.showOpenFilePicker({
          types: [{
            description: 'Fichier Excel RH',
            accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] }
          }]
        });

        const file = await handle.getFile();
        const arrayBuffer = await file.arrayBuffer();
        const classeur = XLSX.read(arrayBuffer, { type: 'array' });

        // 2. Extraire le Hash stocké en B2 de la feuille "Parametres"
        let hashAttendu = HASH_DEFAUT;
        if (classeur.Sheets && classeur.Sheets["Parametres"]) {
          const sheet = classeur.Sheets["Parametres"];
          if (sheet["B2"] && sheet["B2"].v) {
            hashAttendu = String(sheet["B2"].v).trim();
          }
        }

        // 3. Demander le mot de passe
        const mdpSaisi = prompt("Saisissez le mot de passe Administrateur RH :");
        if (mdpSaisi === null) return;

        const hashSaisi = await hacherTexte(mdpSaisi.trim());

        // 4. Validation
        if (hashSaisi === hashAttendu) {
          window.location.href = "saisie_fmpa.html";
        } else {
          alert("Accès refusé : Mot de passe incorrect !");
        }

      } catch (e) {
        if (e.name !== 'AbortError') {
          alert("Erreur lors de la lecture du fichier : " + e.message);
        }
      }
    }
  </script>

</body>
