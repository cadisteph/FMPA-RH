<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIS Caucriauville — Portail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy-950:#0a0f1a;
    --navy-900:#121c2e;
    --navy-800:#1c2947;
    --navy-700:#25355a;
    --gold:#f4c400;
    --gold-bright:#ffd93d;
    --red:#e2141f;
    --sky:#0096e6;
    --paper:#f5f6f8;
    --ink:#05070c;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
  }

  body{
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, #16233c 0%, var(--navy-950) 62%);
    color:var(--paper);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:5vh 6vw 5vh;
    min-height:100vh;
    gap:2.4vh;
  }

mXf+f45sAAAAASUVORK54II==");
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center top;
    margin-top:0.8vh;
  }

  .nav-grid{
    width:100%;
    max-width:980px;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
  }

  @media (max-width: 680px){
    .nav-grid{
      grid-template-columns:1fr;
    }
  }

  /* Style des cartes */
  .nav-card{
    background:linear-gradient(145deg, rgba(28,41,71,0.85), rgba(18,28,46,0.95));
    border:1px solid rgba(244,196,0,0.25);
    border-radius:12px;
    padding:22px 24px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    transition:transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .nav-card:hover{
    transform:translateY(-3px);
    border-color:var(--gold);
    box-shadow:0 14px 35px rgba(244,196,0,0.15);
  }

  .card-title{
    font-family:'Oswald', sans-serif;
    font-size:1.35rem;
    font-weight:600;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:14px;
  }

  /* Formulaire et champs de saisie */
  .auth-form{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .auth-input{
    width:100%;
    padding:11px 14px;
    background:rgba(10,15,26,0.7);
    border:1px solid rgba(244,196,0,0.3);
    border-radius:6px;
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    outline:none;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .auth-input:focus{
    border-color:var(--gold-bright);
    box-shadow:0 0 8px rgba(244,196,0,0.3);
  }

  .auth-btn, .nav-btn{
    width:100%;
    padding:11px;
    background:var(--gold);
    color:var(--navy-950);
    border:none;
    border-radius:6px;
    font-family:'Oswald', sans-serif;
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    transition:background-color 0.2s ease, transform 0.1s ease;
    text-decoration:none;
    text-align:center;
    display:block;
  }

  .auth-btn:hover, .nav-btn:hover{
    background:var(--gold-bright);
  }

  .auth-btn:active, .nav-btn:active{
    transform:scale(0.98);
  }

  .foot{
    text-align:center;
    font-size:0.78rem;
    color:rgba(245,246,248,0.45);
    letter-spacing:0.5px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="badge"></div>

  <div class="nav-grid">
    <!-- Carte 1 : Code Secret -->
    <div class="nav-card">
      <div class="card-title">Accès Sécurisé</div>
      <form class="auth-form" onsubmit="event.preventDefault();">
        <input type="password" class="auth-input" placeholder="Saisir le code secret" aria-label="Code secret">
        <button type="submit" class="auth-btn">Valider</button>
      </form>
    </div>

    <!-- Carte 2 : Gestion RH -->
    <div class="nav-card">
      <div class="card-title">Gestion RH</div>
      <div class="auth-form">
        <button type="button" class="nav-btn">Accéder au menu RH</button>
      </div>
    </div>
  </div>

  <div class="foot">
    CIS Caucriauville — Système d'Information Opérationnel
  </div>
</div>

</body>
</html>
