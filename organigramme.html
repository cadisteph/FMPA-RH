<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Organigramme - Mind Map CIS</title>
    <!-- CSS de Vis.js pour le réseau/mindmap -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden;
        }
        #header {
            padding: 15px 20px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .btn-retour {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }
        #mindmap {
            width: 100vw;
            height: calc(100vh - 65px);
        }
    </style>
</head>
<body>

    <div id="header">
        <h2>🧠 Organigramme du Centre de Secours</h2>
        <a href="index.html" class="btn-retour">⬅️ Retour au Tableau RH</a>
    </div>

    <div id="mindmap"></div>

    <script src="script_organigramme.js"></script>
</body>
</html>
