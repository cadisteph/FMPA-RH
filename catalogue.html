<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue des Formations - CIS</title>
    <link rel="stylesheet" href="style_catalogue.css">
    <!-- PapaParse si besoin de traiter du CSV localement -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

    <header>
        <h1>📚 Catalogue des Formations</h1>
        <div class="actions-reseau">
            <button class="btn-reseau btn-blue" id="btn-charger">📁 Charger JSON</button>
            <button class="btn-reseau btn-green" id="btn-exporter">💾 Enregistrer le Catalogue (JSON)</button>
            <input type="file" id="file-input" accept=".json" style="display:none;">
        </div>
    </header>

    <div class="layout-container">
        
<!-- COLONNE GAUCHE : LISTE DES FORMATIONS -->
<div class="colonne-gauche">
    <div class="panel" style="height: calc(100vh - 65px); display: flex; flex-direction: column; background-color: #1e293b; padding: 0;">
        
        <!-- TITRE FIXE -->
        <div class="panel-titre" style="flex-shrink: 0; padding: 10px;">Contenu des Formations</div>

        <!-- EN-TÊTES FIXES (Largeurs optimisées par colonne) -->
        <table style="width: 100%; border-collapse: collapse; table-layout: fixed; flex-shrink: 0;">
            <thead>
                <tr style="background-color: #0f172a; font-size: 0.85rem;">
                    <th style="width: 13%; padding: 8px 4px; color: #cbd5e1; font-weight: 600;">Type</th>
                    <th style="width: 14%; padding: 8px 4px; color: #cbd5e1; font-weight: 600;">Activité</th>
                    <th style="width: 15%; padding: 8px 4px; color: #cbd5e1; font-weight: 600;">Thème / Libellé</th>
                    <th style="width: 40%; padding: 8px 4px; color: #cbd5e1; font-weight: 600;">Séquence / Thématiques</th>
                    <th style="width: 8%; padding: 8px 4px; color: #cbd5e1; font-weight: 600;">Quota (h)</th>
                    <th style="width: 10%; padding: 8px 4px; color: #cbd5e1; font-weight: 600;">Actions</th>
                </tr>
            </thead>
        </table>

        <!-- CORPS DÉROULANT -->
        <div style="flex: 1; overflow-y: auto;">
            <table style="width: 100%; border-collapse: collapse; table-layout: fixed;">
                <colgroup>
                    <col style="width: 13%;">
                    <col style="width: 14%;">
                    <col style="width: 15%;">
                    <col style="width: 40%;">
                    <col style="width: 8%;">
                    <col style="width: 10%;">
                </colgroup>
                <tbody id="liste-formations">
                    <!-- Généré dynamiquement par script_catalogue.js -->
                </tbody>
            </table>
        </div>

    </div>
</div>

        <!-- COLONNE DROITE : FORMULAIRE DE CREATION ET EDITION -->
        <div class="colonne-droite panel">
            <div class="panel-titre" id="form-titre">Ajouter une Formation</div>
            <form id="form-formation">
                <input type="hidden" id="form-id">

                <div class="form-group">
                    <label for="type-module">Type de Module *</label>
                    <select id="type-module" required>
                        <option value="Socle Commun">Socle Commun (Tronc Commun)</option>
                        <option value="Spécialité">Spécialité</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="activite">Activité / Domaine *</label>
                        <input type="text" id="activite" placeholder="Ex: INC, SUAP, COD..." required>
                    </div>
                    <div class="form-group">
                        <label for="libelle">Thème / Libellé *</label>
                        <input type="text" id="libelle" placeholder="Ex: INC 1, RAD 2..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sequence">Séquence / Contenu (Optionnel)</label>
                    <textarea id="sequence" rows="3" placeholder="Ex: Malaise et aggravation de maladie..."></textarea>
                </div>

                <div class="form-group">
                    <label for="quota">Quota Horaire Standard (Heures) *</label>
                    <input type="number" id="quota" min="1" step="0.5" value="6" required>
                </div>

                <button type="submit" class="btn-submit" id="btn-save">➕ Ajouter au catalogue</button>
                <button type="button" class="btn-cancel" id="btn-cancel" style="display: none;">Annuler la modification</button>
            </form>
        </div>
    </div>

    <script src="script_catalogue.js"></script>
</body>
</html>
