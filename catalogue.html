<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue des Formations - CIS</title>
    <link rel="stylesheet" href="style_catalogue.css">
    <!-- Remplacement de PapaParse par SheetJS (xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <header>
        <h1>📚 Catalogue des Formations</h1>
        <div class="actions-reseau">
            <input type="file" id="file-input" accept=".xlsx" style="display:none;">
        </div>
        <button type="button" id="btn-connect-file">📲 Charger FMPA-RH.xlsx</button>
    </header>

    <div class="layout-container">
        
        <!-- COLONNE GAUCHE : TABLEAU -->
        <div class="colonne-gauche">
            <div class="panel panel-tableau">
                
                <div class="panel-titre">Contenu des Formations</div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 8%;">Type</th>
                                <th style="width: 9%;">Activité</th>
                                <th style="width: 8%;">Thème</th>
                                <th style="width: 38%;">Séquence / Thématiques</th>
                                <th style="width: 6%;">Durée(h)</th>
                                <th style="width: 23%;">Dispenses</th>
                                <th style="width: 8%;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="liste-formations">
                            <!-- Généré dynamiquement par script_catalogue.js -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <!-- COLONNE DROITE : FORMULAIRE -->
        <div class="colonne-droite panel">
            <div class="panel-titre" id="form-titre">Ajouter une Formation</div>
            <form id="form-formation">
                <input type="hidden" id="form-id">

                <div class="form-group">
                    <label for="type-module">Type de Module *</label>
                    <select id="type-module" required>
                        <option value="Socle Commun">Socle Commun (Tronc Commun)</option>
                        <option value="Spécialité">Spécialité</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="activite">Activité / Domaine *</label>
                        <input type="text" id="activite" placeholder="Ex: INC, SUAP, COD..." required>
                    </div>
                    <div class="form-group">
                        <label for="libelle">Thème / Libellé *</label>
                        <input type="text" id="libelle" placeholder="Ex: INC 1, RAD 2..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sequence">Séquence / Contenu (Optionnel)</label>
                    <textarea id="sequence" rows="3" placeholder="Ex: Malaise et aggravation de maladie..."></textarea>
                </div>

                <div class="form-group">
                    <label for="quota">Quota Horaire Standard (Heures) *</label>
                    <input type="number" id="quota" min="1" step="0.5" value="6" required>
                </div>

                <!-- Bloc DISPENSES dynamiques par Profil -->
                <div class="form-group">
                    <label>Profils spécifiques / Dispenses :</label>
                    
                    <div id="liste-lignes-modulations"></div>

                    <button type="button" id="btn-ajouter-ligne-profil" class="btn-action margin-top-5">
                        ➕ Ajouter un profil / quota spécifique
                    </button>
                    
                    <small style="color: #94a3b8; display: block; margin-top: 6px;">
                        Exemple : Profil = <code>COD1, COD6...</code> | Quota = <code>0</code> (dispense totale) ou <code>6</code> h...
                    </small>
                </div>

                <button type="submit" id="btn-save" class="btn-submit">💾 Enregistrer dans le catalogue</button>
                <button type="button" class="btn-cancel" id="btn-cancel" style="display: none;">Annuler la modification</button>
            </form>
        </div>

    </div>

    <!-- Datalist dynamique des profils -->
    <datalist id="liste-profils-dispenses"></datalist>

    <script src="script_catalogue.js?v=2"></script>
</body>
</html>
