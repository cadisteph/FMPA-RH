<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisie Groupée des Formations FMPA</title>
    <link rel="stylesheet" href="style_saisie.css">
</head>
<body>

    <header class="app-header">
        <div class="header-titles">
            <h1>🧑‍🚒 Saisie Groupée des Formations FMPA</h1>
            <p>Gestion des saisies de formations et suivi d'avancement</p>
        </div>
        <div class="header-actions">
            <button type="button" id="btn-import-suivi" class="btn btn-secondary">📂 Charger suivi.csv</button>
            <input type="file" id="file-input-suivi" accept=".csv" style="display:none;">

            <button type="button" id="btn-import-csv" class="btn btn-secondary">📂 Importer baseAgents.csv</button>
            <input type="file" id="file-input-csv" accept=".csv" style="display:none;">

            <button type="button" id="btn-export-csv" class="btn btn-success">📥 Exporter le Suivi (CSV)</button>
        </div>
    </header>

    <main class="main-container">
        <!-- Section de gauche : Tableau des agents -->
        <section class="panel panel-left">
            <div class="panel-header">
                <div class="filters-bar">
                    <div class="filter-group">
                        <label for="filter-equipe">Équipe</label>
                        <select id="filter-equipe">
                            <option value="">Toutes</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-statut">Statut</label>
                        <select id="filter-statut">
                            <option value="">Tous</option>
                        </select>
                    </div>
                    <div class="filter-group search-group">
                        <label for="filter-search">Recherche</label>
                        <input type="text" id="filter-search" placeholder="Nom, prénom, matricule...">
                    </div>
                    <button type="button" id="btn-reset-filters" class="btn btn-small">Réinitialiser</button>
                </div>
                <div class="selection-info">
                    <span id="count-badge" class="badge">0 agent(s)</span>
                    <span id="selection-status">👥 0 agent(s) sélectionné(s)</span>
                </div>
            </div>

            <!-- Conteneur avec défilement horizontal -->
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="col-chk"><input type="checkbox" id="select-all"></th>
                            <th class="col-sticky">Agent</th>
                            <th>Équipe</th>
                            <th>Statut</th>
                            <th>Avancement Socle</th>
                            <th>Avancement Spécialités</th>
                            <th>Total Socle</th>
                            <th>Total Spé.</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-agents">
                        <!-- Généré dynamiquement -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Section de droite : Formulaire de saisie -->
        <section class="panel panel-right">
            <h2>Détails de la Formation</h2>
            <form id="form-saisie-groupee">
                <div class="form-group">
                    <label for="saisie-date">Date de réalisation *</label>
                    <input type="date" id="saisie-date" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="saisie-heure-debut">Heure Début *</label>
                        <input type="time" id="saisie-heure-debut" value="08:00" required>
                    </div>
                    <div class="form-group">
                        <label for="saisie-heure-fin">Heure Fin *</label>
                        <input type="time" id="saisie-heure-fin" value="12:00" required>
                    </div>
                </div>

                <div class="duree-box">
                    Durée calculée : <strong id="duree-calculee">4.0 h</strong>
                </div>

                <div class="form-group">
                    <label for="saisie-activite">Domaine / Activité *</label>
                    <select id="saisie-activite" required>
                        <option value="">-- Choisir un domaine --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="saisie-theme">Thème de la formation *</label>
                    <select id="saisie-theme" class="select-small-text" required disabled>
                        <option value="">-- Choisir une formation --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="saisie-formateur">Formateur</label>
                    <input type="text" id="saisie-formateur" list="liste-formateurs" placeholder="Nom du formateur">
                    <datalist id="liste-formateurs"></datalist>
                </div>

                <div class="form-group">
                    <label for="saisie-commentaires">Commentaires / Remarques</label>
                    <textarea id="saisie-commentaires" rows="2" placeholder="Précisions éventuelles..."></textarea>
                </div>

                <button type="submit" id="btn-valider-groupe" class="btn btn-primary btn-block" disabled>
                    ✅ Valider la saisie pour la sélection
                </button>
            </form>
        </section>
    </main>

    <script src="script_saisie.js"></script>
</body>
</html>
