<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cis Le Havre - Cauriauville : Suivi RH & FMA</title>
  
  <!-- Liaison vers votre feuille de style CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Bouton Connecter (votre bouton d'origine avec l'icône lien) -->
<button type="button" class="btn-reseau" onclick="connecterFichierReseau()">
    🔗 Connecter le fichier réseau (baseAgents.xlsx)
</button>

<!-- Bouton Enregistrer (votre bouton d'origine avec l'icône disquette) -->
<button type="button" class="btn-reseau" onclick="enregistrerFichierReseau()">
    💾 Enregistrer les modifications sur le réseau
</button>

<!-- Texte de statut -->
<span id="statusReseau">Aucun fichier connecté</span>
  </div>

  <!-- Contenu principal de votre application (Formulaire, filtres, tableaux...) -->
  <header>
    <h1>Cis Le Havre - Cauriauville : Suivi RH & FMA</h1>
  </header>

  <main class="conteneur-principal">
  <!-- Colonne Gauche : Filtres et Tableau -->
  <section class="colonne-gauche">
    <div class="barre-filtres">
      <input type="text" id="rh_recherche" placeholder="Rechercher un agent...">
      <span id="compteurAgentsRH">0 agent(s)</span>
    </div>

    <table class="table-rh">
      <thead>
        <tr>
          <th>Matricule</th>
          <th>Sexe</th>
          <th>Nom / Prénom</th>
          <th>Équipe</th>
          <th>Statut</th>
          <th>Grade</th>
          <th>Fonction</th>
          <th>Spécialités</th>
          <th>Régime</th>
          <th>Téléphone</th>
        </tr>
      </thead>
      <tbody id="corpsRH">
        <!-- Les agents s'affichent ici -->
      </tbody>
    </table>
  </section>

  <!-- Colonne Droite : Formulaire de saisie -->
  <aside class="colonne-droite">
    <div class="carte-formulaire">
      <h3>Saisie / Édition Agent</h3>
      <form id="formAgent" onsubmit="event.preventDefault(); doubleSauvegarde();">
        <input type="hidden" id="agentId">

        <label for="matricule">Matricule</label>
        <input type="text" id="matricule" required>

        <label for="nom">Nom</label>
        <input type="text" id="nom" required>

        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" required>

        <label for="equipe">Équipe</label>
        <select id="equipe">
          <option value="Equipe A">Équipe A</option>
          <option value="Equipe B">Équipe B</option>
          <option value="Encadrement">Encadrement</option>
          <option value="SPV">SPV</option>
        </select>

        <label for="statut">Statut</label>
        <select id="statut">
          <option value="SPP">SPP</option>
          <option value="SPV">SPV</option>
        </select>

        <label for="telephone">Téléphone</label>
        <input type="text" id="telephone">

        <label for="email">Email</label>
        <input type="email" id="email">

        <div class="actions-form">
          <button type="submit" class="btn-valider">💾 Enregistrer l'agent</button>
          <button type="reset" class="btn-annuler">❌ Réinitialiser</button>
        </div>
      </form>
    </div>
  </aside>
</main>

  <!-- 1. Bibliothèque externe pour la gestion des fichiers Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <!-- 2. Liaison vers votre fichier JavaScript personnalisé -->
  <script src="script.js"></script>
</body>
</html>
